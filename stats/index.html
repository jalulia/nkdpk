<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>NakedPak · Site stats</title><link rel="stylesheet" href="../assets/site/manifest.css"><link rel="stylesheet" href="stats.css"><script defer src="stats.js"></script></head>
<body><main><header><a href="../">NakedPak</a></header>
<section id="access" hidden><h1>Site stats</h1><p>Open your private stats link to view activity.</p></section>
<section id="panel" hidden><div class="heading"><h1>Site stats</h1><div class="controls"><label for="range">Period</label><select id="range"><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select><button id="refresh" type="button">Refresh</button></div></div>
<p id="status" role="status" aria-live="polite"></p>
<div id="report" hidden><dl class="numbers"><div><dt>Index views</dt><dd id="index-count"></dd></div><div><dt>Study opens</dt><dd id="study-count"></dd></div><div><dt>Clicks from the index</dt><dd id="link-count"></dd></div></dl>
<section class="daily"><h2>Daily activity</h2><div class="legend"><span>Index views</span><span>Study opens</span></div><div id="plot"></div><div class="endpoints"><span id="first"></span><span id="last"></span></div><p id="day-detail" class="note" role="status" hidden></p></section>
<section class="popular"><h2>Most-opened boards</h2><p class="note">Each board counts once per study load.</p><ol id="boards"></ol><p id="empty" hidden>No boards opened in this period.</p></section>
</div></section></main></body></html>
